# Ubuntu 24.04: install in /etc/nginx/sites-available/3dgrt-models,
# then enable via a symlink in sites-enabled. This is an HTTP bootstrap;
# certbot --nginx -d models.hhds-us01.xyz --redirect adds HTTPS afterwards.
# Include this file inside nginx's http context, not inside another server.

# Cache only successful binary responses. Missing objects, metadata and
# editable alignment files must never inherit a long-lived binary TTL.
map "$status:$uri" $threedgrt_model_cache {
    default "no-store";
    ~^(200|206|304):/models/.*\.(bin|gz)$ "public, max-age=2592000, immutable";
}

server {
    listen 80;
    server_name models.hhds-us01.xyz;
    root /var/www/3dgrt-assets;

    sendfile on;
    gzip off;
    autoindex off;
    default_type application/octet-stream;
    types {
        application/json json;
        application/octet-stream bin gz;
    }

    # These models are public downloads; the viewer fetches without credentials.
    # Keeping all headers at this level avoids nginx 1.24 inheritance pitfalls.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD" always;
    add_header Access-Control-Expose-Headers "Content-Length, ETag" always;
    add_header Cache-Control $threedgrt_model_cache always;
    add_header X-Content-Type-Options nosniff always;

    location /models/ {
        limit_except GET { deny all; } # GET also permits HEAD in nginx.
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
