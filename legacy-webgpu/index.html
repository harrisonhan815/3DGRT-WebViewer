<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>3DGRT Test</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="三维场景，拖动转向，WASD 移动"></canvas>
  <div id="alignment-overlay" aria-label="参考地面和三轴校正工具"></div>
  <aside id="panel">
    <header><strong>3DGRT Viewer</strong><span>WebGPU 光追预览</span></header>
    <label>模型<select id="model" disabled></select></label>
    <label>相机<select id="camera" disabled></select></label>
    <details id="alignment-controls">
      <summary>可视化地平面校正</summary>
      <label class="check"><input id="align-tool" type="checkbox" disabled>显示地平面与三轴工具</label>
      <label class="check"><input id="align-enabled" type="checkbox" disabled>应用观察中心与竖直方向</label>
      <button id="align-center" disabled>放到当前视野前方</button>
      <div class="row buttons"><button id="align-reset" disabled>恢复原始</button><button id="align-save" disabled>保存校正</button></div>
      <p class="help">拖动红 / 绿 / 蓝箭头沿 X / Y / Z 平移，拖动圆环绕对应轴旋转。松开后应用；Esc 取消本次拖动。Y 轴是地面法线，原点是观察中心。</p>
      <p id="align-status" role="status" aria-live="polite" data-state="absent">等待模型</p>
    </details>
    <label>渲染方式<select id="render-mode">
      <option value="bvh" selected>BVH 光追</option>
      <option value="tiled">屏幕分块光追</option>
    </select></label>
    <div class="row">
      <label>静止渲染宽度<select id="resolution">
        <option value="320">320 px</option><option value="480">480 px</option>
        <option value="640" selected>640 px</option><option value="960">960 px</option>
        <option value="1280">1280 px</option><option value="1920">1920 px</option>
      </select></label>
      <label>视场角<input id="fov" type="number" min="20" max="120" value="70" step="1"></label>
    </div>
    <label class="check"><input id="adaptive" type="checkbox" checked>移动时自适应分辨率</label>
    <label class="check"><input id="fisheye-enabled" type="checkbox" checked>显示 180° 鱼眼对比</label>
    <label>交互帧率目标<select id="target-fps">
      <option value="30" selected>30 FPS</option><option value="60">60 FPS</option>
    </select></label>
    <label>移动速度<input id="speed" type="range" min="-2" max="2" value="0" step="0.1"></label>
    <div class="row buttons"><button id="reset" disabled>重置视角</button><button id="save" disabled>保存图片</button></div>
    <label class="check"><input id="continuous" type="checkbox">持续渲染 / 测帧率</label>
    <p id="details">等待载入模型</p>
    <p id="stats" title="FPS 为连续完成帧率；GPU 为最近一次计算阶段采样，默认每 30 帧更新。">—</p>
    <p id="quality" class="muted"></p>
    <p class="help">左键拖动转向 · 右键拖动平移 · 滚轮前后<br>WASD 移动 · Q/E 上下 · Shift 加速</p>
    <p id="adapter" class="muted"></p>
  </aside>
  <button id="toggle" aria-label="展开或收起控制栏">☰</button>
  <button id="safe-exit" type="button" title="停止渲染并清理资源后关闭页面">安全退出</button>
  <section id="fisheye-panel" aria-label="当前视角的鱼眼投影对比">
    <div class="fisheye-heading"><strong>180° 鱼眼对比</strong><button id="fisheye-hide" type="button" aria-label="关闭鱼眼对比">×</button></div>
    <canvas id="fisheye-view" width="192" height="192" aria-label="跟随主相机位姿的180度等距鱼眼图像" hidden></canvas>
    <p id="fisheye-status" aria-live="polite">等待当前视角</p>
  </section>
  <div id="loading" role="status"><strong id="load-title">正在初始化 WebGPU</strong><progress id="progress"></progress><span id="load-detail">模型将在本机显卡上渲染</span></div>
  <div id="error" role="alert" hidden></div>
  <section id="exit-panel" role="status" aria-live="polite" tabindex="-1" hidden>
    <strong id="exit-title">正在安全退出</strong>
    <p id="exit-status"></p>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
